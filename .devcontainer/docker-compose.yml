# Devcontainer services for DocWeave development.
# Modelled on frappe/frappe_docker devcontainer-example/docker-compose.yml.
# Development credentials only: never reuse these values outside this container.
name: docweave

services:
  app:
    # Prebuilt dev image (.devcontainer/Dockerfile, published by
    # .github/workflows/dev-image.yml): the pinned devcontainer base with the
    # bench, Frappe and ERPNext already installed. A new frappe-bench volume is
    # seeded from it. Pinned by digest: the workflow republishes the tag on
    # every script change, so the digest is what keeps codespaces on a known
    # image. The tag must match the pins in post-create.sh. Update tag and
    # digest together, only after the workflow has published them (README,
    # "Fast start").
    image: ghcr.io/arieradle/docweave-dev:frappe-v16.53.0-erpnext-v16.52.1@sha256:43e5e4dbc459e7450d8d8051bbdd708d9502694f3dffeb54792792c72b195e47
    command: sleep infinity
    volumes:
      - ..:/workspaces/docweave:cached
      - frappe-bench:/home/vscode/frappe-bench
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: "123"
      MARIADB_ROOT_PASSWORD: "123"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - mariadb-data:/var/lib/mysql

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

volumes:
  frappe-bench:
  mariadb-data:
  redis-queue-data:

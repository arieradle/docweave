# Builds the prebuilt DocWeave dev image (.devcontainer/Dockerfile) and
# publishes it to GitHub Container Registry, tagged with the Frappe and ERPNext
# versions pinned in .devcontainer/post-create.sh.
#
# After a version bump: wait for this workflow, then point
# .devcontainer/docker-compose.yml at the new tag. That devcontainer change
# makes Codespaces prebuilds refresh (README, "Fast start").
name: dev-image

on:
  push:
    branches: [main]
    paths:
      - .devcontainer/Dockerfile
      - .devcontainer/post-create.sh
      - .github/workflows/dev-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Read pinned versions
        id: versions
        run: |
          frappe="$(sed -n 's/^FRAPPE_TAG="\(.*\)"$/\1/p' .devcontainer/post-create.sh)"
          erpnext="$(sed -n 's/^ERPNEXT_TAG="\(.*\)"$/\1/p' .devcontainer/post-create.sh)"
          test -n "${frappe}" && test -n "${erpnext}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/docweave-dev"
          {
            echo "image=${image}"
            echo "tag=frappe-${frappe}-erpnext-${erpnext}"
          } >> "${GITHUB_OUTPUT}"
          echo "Building ${image}:frappe-${frappe}-erpnext-${erpnext}"

      - uses: docker/setup-buildx-action@v3.11.1

      - uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6.18.0
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          push: true
          tags: |
            ${{ steps.versions.outputs.image }}:${{ steps.versions.outputs.tag }}
            ${{ steps.versions.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=DocWeave dev image: Frappe bench with ERPNext, no site
          cache-from: type=gha
          cache-to: type=gha,mode=max

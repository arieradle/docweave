# Builds the prebuilt DocWeave dev image (.devcontainer/Dockerfile) and
# publishes it to GitHub Container Registry, tagged with the Frappe and ERPNext
# versions pinned in .devcontainer/post-create.sh.
#
# Codespaces use the image by digest (.devcontainer/docker-compose.yml), so a
# rebuild changes nothing until compose is pointed at the new digest. That
# devcontainer change is also what makes Codespaces prebuilds refresh
# (README, "Fast start"). Actions are pinned to commit SHAs.
name: dev-image

on:
  push:
    branches: [main]
    paths:
      - .devcontainer/Dockerfile
      - .devcontainer/post-create.sh
      - .github/workflows/dev-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-image
  cancel-in-progress: false

jobs:
  build:
    # Only main publishes: a manual run on another branch must not overwrite
    # the version tag main's devcontainer pulls.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read pinned versions
        id: versions
        run: |
          frappe="$(sed -n 's/^FRAPPE_TAG="\(.*\)"$/\1/p' .devcontainer/post-create.sh)"
          erpnext="$(sed -n 's/^ERPNEXT_TAG="\(.*\)"$/\1/p' .devcontainer/post-create.sh)"
          test -n "${frappe}" && test -n "${erpnext}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/docweave-dev"
          {
            echo "image=${image}"
            echo "tag=frappe-${frappe}-erpnext-${erpnext}"
          } >> "${GITHUB_OUTPUT}"
          echo "Building ${image}:frappe-${frappe}-erpnext-${erpnext}"

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          load: true
          tags: docweave-dev:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the bench in the image
        run: |
          docker run --rm --user vscode docweave-dev:smoke bash -euo pipefail -c '
            cd /home/vscode/frappe-bench
            test -f .docweave-bench-ready
            grep -qx frappe sites/apps.txt
            grep -qx erpnext sites/apps.txt
            /home/vscode/.local/bin/bench --version
            env/bin/python -c "import frappe, erpnext; print(\"frappe\", frappe.__version__, \"erpnext\", erpnext.__version__)"
            test -z "$(ls sites | grep -v -e ^assets\$ -e ^apps.txt\$ -e ^apps.json\$ -e ^common_site_config.json\$)"
            echo "bench OK, no site in the image"
          '

      - name: Push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          push: true
          tags: |
            ${{ steps.versions.outputs.image }}:${{ steps.versions.outputs.tag }}
            ${{ steps.versions.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=DocWeave dev image: Frappe bench with ERPNext, no site
          cache-from: type=gha
          cache-to: type=gha,mode=max
